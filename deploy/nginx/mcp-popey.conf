# nginx site for mcp-popey (see docs/INSTALACION-VPS.txt, section 8).
# Replace <DOMINIO>, copy to /etc/nginx/sites-available/mcp-popey and run
# `certbot --nginx -d <DOMINIO>` to add HTTPS to this same server block.
server {
    listen 80;
    server_name <DOMINIO>;

    location = /mcp {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streamable HTTP may answer with SSE: do not buffer.
        proxy_buffering off;
        proxy_cache off;
        # Above QUERY_SQL_TIMEOUT_MS (30 s by default).
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }

    location / {
        return 404;
    }
}
